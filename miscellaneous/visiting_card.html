<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHAUNIX GROUP · Visiting Card</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

        :root {
            --ink: #0B1F3A;
            --ink-2: #122A4D;
            --paper: #FDFEFF;
            --slate: #3C4658;
            --slate-soft: #7C8598;
            --hair: #E1E6EE;
            --accent: #1454EF;
            --accent-soft: #EAF0FF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #E7EBF2;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'IBM Plex Sans', system-ui, sans-serif;
            padding: 32px 16px 64px;
            min-height: 100vh;
        }

        /* ---------- toolbar ---------- */
        .toolbar {
            display: flex;
            gap: 14px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 13px 30px;
            background: var(--ink);
            color: #fff;
            border: none;
            font-family: 'IBM Plex Sans';
            font-size: 14px;
            font-weight: 600;
            letter-spacing: .2px;
            cursor: pointer;
            box-shadow: 0 8px 22px rgba(11, 31, 58, .22);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(11, 31, 58, .28);
        }

        .btn-action svg {
            width: 18px;
            height: 18px;
        }

        .badge {
            background: rgba(255, 255, 255, .16);
            padding: 3px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .caption {
            font-size: 12px;
            color: #6B7280;
            letter-spacing: .2px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* ---------- grid ---------- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px 16px;
            max-width: 1240px;
            width: 100%;
            background: var(--paper);
            padding: 26px;
            box-shadow: 0 24px 60px rgba(11, 31, 58, .14);
        }

        .card-wrapper {
            width: 90mm;
            height: 55mm;
            margin: 0 auto;
            perspective: 1400px;
            max-width: 100%;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform .7s cubic-bezier(.23, 1, .32, 1);
            transform-style: preserve-3d;
        }

        .card-wrapper:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(11, 31, 58, .10);
            border: 1px solid var(--hair);
        }

        /* ---------- FRONT ---------- */
        .card-front {
            background: var(--paper);
            display: grid;
            grid-template-columns: 32mm 1fr;
        }

        .card-left {
            background: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            padding: 3mm 2mm;
            position: relative;
        }

        .logo-img {
            width: 19mm;
            height: 19mm;
            object-fit: contain;
            margin-bottom: 1.6mm;
            display: block;
        }

        .card-brand {
            font-family: 'Space Grotesk';
            font-weight: 700;
            font-size: 8.6pt;
            line-height: 1.1;
            color: #fff;
        }

        .card-brand em {
            display: block;
            font-style: normal;
            font-size: 7.4pt;
            color: #8FB0FF;
            font-weight: 500;
            letter-spacing: .3px;
        }

        .card-tagline {
            font-size: 5.2pt;
            color: #A9B9D6;
            margin-top: 1.8mm;
            line-height: 1.4;
            letter-spacing: .2px;
        }

        .card-right {
            padding: 3.2mm 4mm 2.6mm;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .name {
            font-family: 'Space Grotesk';
            font-size: 12pt;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -.2px;
        }

        .designation {
            font-size: 7.5pt;
            font-weight: 600;
            color: var(--accent);
            margin: .6mm 0 1.8mm;
        }

        .rule {
            width: 14mm;
            height: 2.2px;
            background: var(--accent);
            margin-bottom: 2.2mm;
            clip-path: polygon(0 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: .9mm;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 2mm;
            font-size: 7.6pt;
            color: var(--slate);
        }

        .contact-row .icon {
            width: 3.6mm;
            height: 3.6mm;
            flex: none;
            color: var(--accent);
        }

        .contact-row .icon svg {
            width: 100%;
            height: 100%;
        }

        .contact-row a {
            color: var(--ink);
            text-decoration: none;
            font-weight: 500;
        }

        .contact-row a:hover {
            text-decoration: underline;
        }

        .vertical-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1mm;
            margin-top: 2.6mm;
        }

        .vtag {
            display: flex;
            align-items: center;
            gap: 1mm;
            background: var(--accent-soft);
            padding: 1mm 1.4mm;
            font-size: 5.6pt;
            font-weight: 600;
            color: var(--slate);
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }

        .vtag svg {
            width: 2.6mm;
            height: 2.6mm;
            flex: none;
            color: var(--accent);
        }

        .card-footer-text {
            font-size: 5.6pt;
            color: var(--slate-soft);
            margin-top: 2mm;
            padding-top: 1.6mm;
            border-top: 1px solid var(--hair);
            font-weight: 500;
            letter-spacing: .2px;
        }

        /* ---------- BACK (COMPACT) ---------- */
        .card-back {
            transform: rotateY(180deg);
            background: var(--paper);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2.2mm 3.5mm 2.2mm;
        }

        .back-head {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.6mm;
            margin-bottom: 0.8mm;
        }

        .back-head .logo-img {
            width: 7mm;
            height: 7mm;
            margin: 0;
        }

        .back-title {
            font-family: 'Space Grotesk';
            font-size: 7.6pt;
            font-weight: 700;
            color: var(--ink);
        }

        .back-title em {
            font-style: normal;
            color: var(--accent);
        }

        .back-verticals {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8mm;
            margin-bottom: 1mm;
        }

        .back-vtag {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4mm;
            background: var(--accent-soft);
            padding: 0.8mm 0.6mm;
            font-size: 4.8pt;
            font-weight: 600;
            color: var(--slate);
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }

        .back-vtag svg {
            width: 2.8mm;
            height: 2.8mm;
            color: var(--accent);
        }

        .qr-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.6mm;
            margin-bottom: 0.8mm;
        }

        .qr-item {
            background: #fff;
            border: 1px solid var(--hair);
            padding: 0.8mm 0.6mm 0.6mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-container canvas,
        .qr-container img {
            max-width: 100%;
            max-height: 8mm;
            image-rendering: pixelated;
        }

        .qr-label {
            display: flex;
            align-items: center;
            gap: 0.6mm;
            font-size: 5pt;
            font-weight: 700;
            color: var(--ink);
            margin-top: 0.4mm;
        }

        .qr-label svg {
            width: 2.2mm;
            height: 2.2mm;
            color: var(--accent);
        }

        .qr-desc {
            font-size: 4.2pt;
            color: var(--slate-soft);
        }

        .back-meta {
            text-align: center;
            font-size: 5pt;
            color: var(--slate);
            line-height: 1.4;
        }

        .back-meta .addr {
            color: var(--slate-soft);
            font-size: 4.6pt;
        }

        .back-tagline {
            text-align: center;
            font-size: 4.6pt;
            color: var(--ink);
            font-weight: 600;
            padding-top: 0.8mm;
            margin-top: 0.8mm;
            border-top: 1px solid var(--hair);
            letter-spacing: .1px;
        }

        @media (max-width:820px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width:420px) {
            .card-wrapper {
                transform: scale(.92);
                transform-origin: top center;
            }
        }

        @media print {

            .card-wrapper:nth-child(odd) .card-front {
                display: grid !important;
            }

            .card-wrapper:nth-child(odd) .card-back {
                display: none !important;
            }

            .card-wrapper:nth-child(even) .card-front {
                display: none !important;
            }

            .card-wrapper:nth-child(even) .card-back {
                padding: 3mm 3.5mm;
            }

            .card-back .back-head {
                margin-top: 0;
                padding-top: 0;
            }

            .card-back .back-verticals {
                margin-top: 0;
            }

            @page {
                size: A4 portrait;
                margin: 0;
            }

            html,
            body {
                width: 210mm;
                margin: 0;
                padding: 0;
                background: #fff !important;
            }

            .toolbar,
            .caption {
                display: none !important;
            }

            .card-grid {
                width: 210mm;
                grid-template-columns: 70mm 70mm;
                grid-template-rows: repeat(5, 55mm);
                column-gap: 10mm;
                row-gap: 3mm;
                padding: 3mm 10mm;
                margin: 0;
                background: transparent !important;
                box-shadow: none !important;
            }

            .card-wrapper {
                width: 90mm;
                height: 55mm;
                max-width: none;
                margin: 0;
                perspective: none;
                break-inside: avoid;
            }

            .card-inner {
                width: 90mm;
                height: 55mm;
                transform: none !important;
                transition: none !important;
            }

            .card-front,
            .card-back {
                width: 90mm;
                height: 55mm;
                position: absolute;
                top: 0;
                left: 0;
                box-shadow: none !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

            .card-front {
                display: grid !important;
                transform: none !important;
                z-index: 10;
            }

        }
    </style>
</head>

        const ICONS = {

            chat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>`,
            mail: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z"/><path d="m22 6-10 7L2 6"/></svg>`,
            globe: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>`,
            code: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg>`,
            shield: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.7 8 11 4.6-2.3 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/></svg>`,
            nodes: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6.7 7.2 10.5 16M17.3 7.2 13.5 16M7 6h10"/></svg>`,
            printer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v7H6z"/></svg>`,

        const VERTICALS = [
            { key: 'TECH', icon: 'code' },
            { key: 'CARE', icon: 'shield' },
            { key: 'DIGITAL', icon: 'nodes' },
            { key: 'PRINT', icon: 'printer' },
            { key: 'ACADEMY', icon: 'cap' },
            { key: 'RECLAIM', icon: 'reclaim' }
        ];

        function vtagRow(cls) {
            return VERTICALS.map(v => `
      <div class="${cls}">
        ${ICONS[v.icon]}
        <span>${v.key}</span>
      </div>`).join('');
        }

        function createCardHTML(index) {
            const waId = 'wa-qr-' + index;
            const webId = 'web-qr-' + index;
            const waLink = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(WHATSAPP_MESSAGE);

            return `
    <div class="card-wrapper">
      <div class="card-inner">

        <div class="card-front">
          <div class="card-left">
            <img src="${LOGO_DATA_URI}" alt="Shaunix Group" class="logo-img" />
            <div class="card-brand">SHAUNIX<em>GROUP</em></div>
            <div class="card-tagline">Technology · Solutions · Growth</div>
          </div>
          <div class="card-right">
            <div class="name">SHAUNIX GROUP</div>
            <div class="designation">Technology · Solutions · Growth</div>
            <div class="rule"></div>
            <div class="contact-list">
              <div class="contact-row"><span class="icon">${ICONS.phone}</span><a href="tel:+${WHATSAPP_NUMBER}">+91 98211 86889</a></div>
              <div class="contact-row"><span class="icon">${ICONS.chat}</span><a href="${waLink}" target="_blank">Chat on WhatsApp</a></div>
              <div class="contact-row"><span class="icon">${ICONS.mail}</span><a href="mailto:shaunixgroup@gmail.com">shaunixgroup@gmail.com</a></div>
              <div class="contact-row"><span class="icon">${ICONS.globe}</span><a href="${WEBSITE_URL}" target="_blank">shaunixgroup.com</a></div>
            </div>
            <div class="vertical-grid">${vtagRow('vtag')}</div>
            <div class="card-footer-text">Mon – Sat · 10 AM – 7 PM</div>
          </div>
        </div>

        <div class="card-back">
          <div class="back-head">
            <img src="${LOGO_DATA_URI}" alt="Shaunix Group" class="logo-img" />
            <div class="back-title">SHAUNIX <em>GROUP</em></div>
          </div>
          <div class="back-verticals">${vtagRow('back-vtag')}</div>
          <div class="qr-row">
            <div class="qr-item">
              <div class="qr-container" id="${waId}"></div>
              <div class="qr-label">${ICONS.chat}WhatsApp</div>
              <div class="qr-desc">Scan to chat</div>
            </div>
            <div class="qr-item">
              <div class="qr-container" id="${webId}"></div>
              <div class="qr-label">${ICONS.globe}Website</div>
              <div class="qr-desc">Scan to visit</div>
            </div>
          </div>
          <div class="back-meta">
            Mon – Sat · 10 AM – 7 PM<br/>
            <span class="addr">A-20, Om Nagar, Badarpur, New Delhi 110044</span>
          </div>
          <div class="back-tagline">Technology for today. Skills for tomorrow. Sustainability for the future.</div>
        </div>

      </div>
    </div>`;
        }

        function generateQR(containerId, text, size) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            new QRCode(container, {
                text: text, width: size, height: size,
                colorDark: '#0B1F3A', colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function generateCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 10; i++) { grid.innerHTML += createCardHTML(i); }
            setTimeout(() => {
                const waLink = 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(WHATSAPP_MESSAGE);
                for (let i = 0; i < 10; i++) {
                    generateQR('wa-qr-' + i, waLink, 34);
                    generateQR('web-qr-' + i, WEBSITE_URL, 34);
                }
            }, 150);
        }

        document.addEventListener('DOMContentLoaded', generateCards);
    </script>
</body>
